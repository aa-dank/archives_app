[project]
name = "archives-app"
version = "1.19.9"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "email-validator>=2.3.0",
    "flask>=3.1.3",
    "flask-bcrypt>=1.0.1",
    "flask-login>=0.6.3",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "gunicorn>=26.2.0",
    "matplotlib>=3.11.2",
    "notebook>=7.6.3",
    "oauthlib>=4.0.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "psycopg[binary,pool]>=3.3.6",
    "pymupdf>=2.0",
    "pgvector>=0.5.1",
    "python-dateutil>=3.0.0",
    # Redis 6.2.20 in production is supported by redis-py 5.x, not 6+.
    "redis>=5.3.1,<6",
    "requests>=2.34.2",
    "rq>=2.12.0,<3",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
